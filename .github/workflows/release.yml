        run: npx semantic-release

  # ── 4. DataLayer (depends on Repository) ───────────────────────────────────
  release-datalayer:
    name: "Release: DataLayer"
    runs-on: ubuntu-latest
    needs: release-localization
    if: ${{ !failure() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Install semantic-release
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changes since last DataLayer release
        id: detect
        run: |
          PROJECT=DataLayer
          PROJECT_PATH=BeClean/BeClean.DataLayer
          LAST_TAG=$(git tag -l "${PROJECT}[0-9]*" --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — scheduling first release"
