          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changes since last Repository release
        id: detect
        run: |
          PROJECT=Repository
          PROJECT_PATH=BeClean/BeClean.Repository
          LAST_TAG=$(git tag -l "${PROJECT}[0-9]*" --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — scheduling first release"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only "$LAST_TAG" HEAD -- "$PROJECT_PATH")
            if [ -n "$CHANGED" ]; then
              echo "Changes detected in $PROJECT_PATH since $LAST_TAG"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "No changes in $PROJECT_PATH since $LAST_TAG — skipping"
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run semantic-release for Repository
        if: steps.detect.outputs.changed == 'true'
        env:
          RELEASE_PROJECT: Repository
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: npx semantic-release

  # ── 3. Localization (no BeClean dependencies) ──────────────────────────────
  release-localization:
