        run: npx semantic-release

  # ── 5. Api (depends on Repository + Localization) ──────────────────────────
  release-api:
    name: "Release: Api"
    runs-on: ubuntu-latest
    needs: release-datalayer
    if: ${{ !failure() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
