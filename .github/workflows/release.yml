name: Release NuGet Packages

on:
  push:
    branches: [release]

permissions:
  contents: write  # Required to push csproj commits and create tags/releases

# ─── Shared step templates (referenced via YAML anchors) ─────────────────────
# GitHub Actions does not support top-level anchors, so steps are repeated per
# job. The structure is identical; only PROJECT, PROJECT_PATH, and RELEASE_PROJECT
# differ between jobs.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Util (no BeClean dependencies) ──────────────────────────────────────
  release-util:
    name: "Release: Util"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required by semantic-release
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Install semantic-release
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changes since last Util release
        id: detect
        run: |
          PROJECT=Util
          PROJECT_PATH=BeClean/BeClean.Util
          LAST_TAG=$(git tag -l "${PROJECT}[0-9]*" --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — scheduling first release"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only "$LAST_TAG" HEAD -- "$PROJECT_PATH")
            if [ -n "$CHANGED" ]; then
              echo "Changes detected in $PROJECT_PATH since $LAST_TAG"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "No changes in $PROJECT_PATH since $LAST_TAG — skipping"
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run semantic-release for Util
        if: steps.detect.outputs.changed == 'true'
        env:
          RELEASE_PROJECT: Util
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: npx semantic-release

  # ── 2. Repository (no BeClean dependencies) ────────────────────────────────
  release-repository:
    name: "Release: Repository"
    runs-on: ubuntu-latest
    needs: release-util
    if: ${{ !failure() }}
    steps:
