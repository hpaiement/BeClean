name: Release NuGet Packages

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    name: Release Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install semantic-release
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Version detection (dry-run, no side effects) ───────────────────────

      - name: Determine Util version
        id: util
        env:
          RELEASE_PROJECT: Util
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag -l "Util[0-9]*" --sort=-v:refname | head -1)
          if [ -n "$LAST_TAG" ] && [ -z "$(git diff --name-only "$LAST_TAG" HEAD -- BeClean/BeClean.Util)" ]; then
            echo "No changes in Util since $LAST_TAG — skipping"
            exit 0
          fi
          SR_OUT=$(npx semantic-release --dry-run 2>&1)
          VERSION=$(echo "$SR_OUT" | grep "next release version" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$VERSION" ] && echo "version=$VERSION" >> $GITHUB_OUTPUT \
                            || echo "No conventional release commits found for Util"

      - name: Determine Repository version
        id: repository
        env:
          RELEASE_PROJECT: Repository
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag -l "Repository[0-9]*" --sort=-v:refname | head -1)
          if [ -n "$LAST_TAG" ] && [ -z "$(git diff --name-only "$LAST_TAG" HEAD -- BeClean/BeClean.Repository)" ]; then
            echo "No changes in Repository since $LAST_TAG — skipping"
            exit 0
          fi
          SR_OUT=$(npx semantic-release --dry-run 2>&1)
          VERSION=$(echo "$SR_OUT" | grep "next release version" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$VERSION" ] && echo "version=$VERSION" >> $GITHUB_OUTPUT \
                            || echo "No conventional release commits found for Repository"

      - name: Determine Localization version
        id: localization
        env:
          RELEASE_PROJECT: Localization
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag -l "Localization[0-9]*" --sort=-v:refname | head -1)
          if [ -n "$LAST_TAG" ] && [ -z "$(git diff --name-only "$LAST_TAG" HEAD -- BeClean/BeClean.Localization)" ]; then
            echo "No changes in Localization since $LAST_TAG — skipping"
            exit 0
          fi
          SR_OUT=$(npx semantic-release --dry-run 2>&1)
          VERSION=$(echo "$SR_OUT" | grep "next release version" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$VERSION" ] && echo "version=$VERSION" >> $GITHUB_OUTPUT \
                            || echo "No conventional release commits found for Localization"

      - name: Determine TestLib version
        id: testlib
        env:
          RELEASE_PROJECT: TestLib
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag -l "TestLib[0-9]*" --sort=-v:refname | head -1)
          if [ -n "$LAST_TAG" ] && [ -z "$(git diff --name-only "$LAST_TAG" HEAD -- BeClean/BeClean.TestLib)" ]; then
            echo "No changes in TestLib since $LAST_TAG — skipping"
            exit 0
          fi
          SR_OUT=$(npx semantic-release --dry-run 2>&1)
          VERSION=$(echo "$SR_OUT" | grep "next release version" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$VERSION" ] && echo "version=$VERSION" >> $GITHUB_OUTPUT \
                            || echo "No conventional release commits found for TestLib"

      - name: Determine DataLayer version
        id: datalayer
        env:
          RELEASE_PROJECT: DataLayer
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag -l "DataLayer[0-9]*" --sort=-v:refname | head -1)
          if [ -n "$LAST_TAG" ] && [ -z "$(git diff --name-only "$LAST_TAG" HEAD -- BeClean/BeClean.DataLayer)" ]; then
            echo "No changes in DataLayer since $LAST_TAG — skipping"
            exit 0
          fi
          SR_OUT=$(npx semantic-release --dry-run 2>&1)
          VERSION=$(echo "$SR_OUT" | grep "next release version" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$VERSION" ] && echo "version=$VERSION" >> $GITHUB_OUTPUT \
                            || echo "No conventional release commits found for DataLayer"

      - name: Determine Api version
        id: api
        env:
          RELEASE_PROJECT: Api
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git tag -l "Api[0-9]*" --sort=-v:refname | head -1)
          if [ -n "$LAST_TAG" ] && [ -z "$(git diff --name-only "$LAST_TAG" HEAD -- BeClean/BeClean.Api)" ]; then
            echo "No changes in Api since $LAST_TAG — skipping"
            exit 0
          fi
          SR_OUT=$(npx semantic-release --dry-run 2>&1)
          VERSION=$(echo "$SR_OUT" | grep "next release version" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$VERSION" ] && echo "version=$VERSION" >> $GITHUB_OUTPUT \
                            || echo "No conventional release commits found for Api"

      # ── Single commit + tags + NuGet publish ──────────────────────────────

      - name: Commit, tag and publish
        if: |
          steps.util.outputs.version != '' ||
          steps.repository.outputs.version != '' ||
          steps.localization.outputs.version != '' ||
          steps.testlib.outputs.version != '' ||
          steps.datalayer.outputs.version != '' ||
          steps.api.outputs.version != ''
        env:
          UTIL_VERSION:         ${{ steps.util.outputs.version }}
          REPOSITORY_VERSION:   ${{ steps.repository.outputs.version }}
          LOCALIZATION_VERSION: ${{ steps.localization.outputs.version }}
          TESTLIB_VERSION:      ${{ steps.testlib.outputs.version }}
          DATALAYER_VERSION:    ${{ steps.datalayer.outputs.version }}
          API_VERSION:          ${{ steps.api.outputs.version }}
          NUGET_API_KEY:        ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          update_version() {
            local csproj=$1 version=$2
            sed -i "s|<VersionPrefix>[^<]*</VersionPrefix>|<VersionPrefix>$version</VersionPrefix>|" "$csproj"
          }

          pack_and_push() {
            local csproj=$1 name=$2
            dotnet pack "$csproj" -c Release -o "./nupkg/$name"
            dotnet nuget push "./nupkg/$name/*.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          }

          # ── Update csproj files ──────────────────────────────────────────
          [ -n "$UTIL_VERSION" ]         && update_version BeClean/BeClean.Util/BeClean.Util.csproj                                   "$UTIL_VERSION"
          [ -n "$REPOSITORY_VERSION" ]   && update_version BeClean/BeClean.Repository/BeClean.Repository.csproj                       "$REPOSITORY_VERSION"
          [ -n "$LOCALIZATION_VERSION" ] && update_version BeClean/BeClean.Localization/BeClean.Localization.csproj                   "$LOCALIZATION_VERSION"
          [ -n "$TESTLIB_VERSION" ]      && update_version BeClean/BeClean.TestLib/BeClean.TestLib.csproj                             "$TESTLIB_VERSION"
          [ -n "$DATALAYER_VERSION" ]    && update_version BeClean/BeClean.DataLayer/BeClean.DataLayer.csproj                         "$DATALAYER_VERSION"
          [ -n "$API_VERSION" ]          && update_version BeClean/BeClean.Api/BeClean.Api.csproj                                     "$API_VERSION"

          # ── Build commit message ─────────────────────────────────────────
          PARTS=()
          [ -n "$UTIL_VERSION" ]         && PARTS+=("Util $UTIL_VERSION")
          [ -n "$REPOSITORY_VERSION" ]   && PARTS+=("Repository $REPOSITORY_VERSION")
          [ -n "$LOCALIZATION_VERSION" ] && PARTS+=("Localization $LOCALIZATION_VERSION")
          [ -n "$TESTLIB_VERSION" ]      && PARTS+=("TestLib $TESTLIB_VERSION")
          [ -n "$DATALAYER_VERSION" ]    && PARTS+=("DataLayer $DATALAYER_VERSION")
          [ -n "$API_VERSION" ]          && PARTS+=("Api $API_VERSION")
          MSG=$(IFS=', '; echo "${PARTS[*]}")

          # ── Commit and push ──────────────────────────────────────────────
          git add \
            BeClean/BeClean.Util/BeClean.Util.csproj \
            BeClean/BeClean.Repository/BeClean.Repository.csproj \
            BeClean/BeClean.Localization/BeClean.Localization.csproj \
            BeClean/BeClean.TestLib/BeClean.TestLib.csproj \
            BeClean/BeClean.DataLayer/BeClean.DataLayer.csproj \
            BeClean/BeClean.Api/BeClean.Api.csproj
          git commit -m "chore(release): $MSG [skip ci]"
          git push

          # ── Create and push version tags (all on this commit) ────────────
          [ -n "$UTIL_VERSION" ]         && git tag "Util$UTIL_VERSION"
          [ -n "$REPOSITORY_VERSION" ]   && git tag "Repository$REPOSITORY_VERSION"
          [ -n "$LOCALIZATION_VERSION" ] && git tag "Localization$LOCALIZATION_VERSION"
          [ -n "$TESTLIB_VERSION" ]      && git tag "TestLib$TESTLIB_VERSION"
          [ -n "$DATALAYER_VERSION" ]    && git tag "DataLayer$DATALAYER_VERSION"
          [ -n "$API_VERSION" ]          && git tag "Api$API_VERSION"
          git push --tags

          # ── Pack and publish to NuGet.org ────────────────────────────────
          [ -n "$UTIL_VERSION" ]         && pack_and_push BeClean/BeClean.Util/BeClean.Util.csproj                 Util
          [ -n "$REPOSITORY_VERSION" ]   && pack_and_push BeClean/BeClean.Repository/BeClean.Repository.csproj     Repository
          [ -n "$LOCALIZATION_VERSION" ] && pack_and_push BeClean/BeClean.Localization/BeClean.Localization.csproj Localization
          [ -n "$TESTLIB_VERSION" ]      && pack_and_push BeClean/BeClean.TestLib/BeClean.TestLib.csproj           TestLib
          [ -n "$DATALAYER_VERSION" ]    && pack_and_push BeClean/BeClean.DataLayer/BeClean.DataLayer.csproj       DataLayer
          [ -n "$API_VERSION" ]          && pack_and_push BeClean/BeClean.Api/BeClean.Api.csproj                   Api
