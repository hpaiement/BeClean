          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changes since last Api release
        id: detect
        run: |
          PROJECT=Api
          PROJECT_PATH=BeClean/BeClean.Api
          LAST_TAG=$(git tag -l "${PROJECT}[0-9]*" --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — scheduling first release"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
